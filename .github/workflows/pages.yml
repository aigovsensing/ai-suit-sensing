name: deploy-dashboard-pages

# AI Litigation Dashboard 를 GitHub Pages 로 빌드/배포한다.
# 백엔드(FastAPI) 없이도 동작하도록, 빌드 시점에 data/*.csv 를 정적 JSON 으로
# 미리 계산(pre-compute)해 docs/ 에 담고 그 결과물을 Pages 아티팩트로 배포한다.
#
# 배포 URL: https://aigovsensing.github.io/ai-suit-sensing/

on:
  push:
    branches: [main]
    paths:
      - "dashboard/frontend/**"
      - "dashboard/data/**"
      - "dashboard/img/**"
      - "dashboard/timeline/**"
      - "dashboard/collector/**"
      - "dashboard/scripts/build_pages.py"
      - "tracker/data/risky-open-datasets.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지(진행 중 배포는 유지, 대기열은 최신만)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # /api/version 의 git 태그/커밋 정보를 위해 전체 히스토리

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: python -m pip install --upgrade pip pandas google-generativeai

      # 사전 생성된 Gemini 월간 보고서를 실행 간에 보존(변경분만 재생성 → 쿼터 절약)
      - name: Restore pre-generated reports cache
        uses: actions/cache@v4
        with:
          path: docs/api/report
          key: gemini-reports-${{ hashFiles('dashboard/data/**') }}
          restore-keys: |
            gemini-reports-

      - name: Build static site into docs/
        run: python dashboard/scripts/build_pages.py --out docs

      # AI 월간 보고서 사전 생성. GEMINI_API_KEY 시크릿이 없으면 스크립트가 정상 no-op.
      # 실패해도 배포는 계속되도록 continue-on-error.
      - name: Pre-generate AI monthly reports (Gemini)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODEL_FALLBACKS: ${{ vars.GEMINI_MODEL_FALLBACKS }}
          REPORT_MAX_MONTHS: ${{ vars.REPORT_MAX_MONTHS || '24' }}
        run: python dashboard/scripts/generate_reports.py --out docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
