name: lawsuit-monitor
permissions:
  contents: write
  issues: write

on:
  schedule:
    # ⚠️ 예약 실행 신뢰성: GitHub Actions 는 매시 정각(minute 0)에 부하가 몰려
    #    schedule 이벤트가 지연되거나 아예 누락(skip)되는 일이 잦다(공식 문서 권고).
    #    → 모든 cron 을 정각이 아닌 :25 로 옮기고, 하루 1회 발행되는 🗓️조간은
    #      슬롯을 이중화(07:10·07:50)해 한 번 누락돼도 다음 슬롯이 발행하도록 한다.
    #      (조간/석간은 trend_already_exists 로 멱등 처리되어 중복 발행되지 않는다.)
    - cron: "25 23,0-8 * * *" # 업무시간 KST 08:25-17:25 매시간
    - cron: "25 9-21/3 * * *" # 그 외 KST 18:25-06:25 3시간마다 (🧠 석간 KST 21:25 = UTC 12:25 포함)
    - cron: "10 22 * * *"     # 🗓️ 조간 1차 (KST 07:10 = UTC 22:10)
    - cron: "50 22 * * *"     # 🗓️ 조간 2차 백업 (KST 07:50 = UTC 22:50) — 1차 누락 대비
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        # 모노레포 통합: 모든 run 스텝을 tracker/ 하위 프로젝트 기준으로 실행
        working-directory: tracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Gemini 동향 요약 기능 활성화 여부 및 기간 (값이 있으면 활성화)
          GEMINI_AISUIT_TREND_DAYS: ${{ vars.GEMINI_AISUIT_TREND_DAYS || secrets.GEMINI_AISUIT_TREND_DAYS }}
          # 이전 이슈 중복 제거 범위 (일수)
          PREVIOUS_ITEM_DEDUP_DAYS: ${{ vars.PREVIOUS_ITEM_DEDUP_DAYS }}
          # 기본값(코드 내 default) = 6일
          # Actions → Variables에 LOOKBACK_DAYS를 만들면 원하는 일수로 조정 가능
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
          # 도켓 후보 Top3 표기(0/1). Actions → Variables에 SHOW_DOCKET_CANDIDATES 설정 가능
          SHOW_DOCKET_CANDIDATES: ${{ vars.SHOW_DOCKET_CANDIDATES }}
          # (옵션) 긴 셀(도켓 후보/최근 업데이트)을 <details>로 접기
          COLLAPSE_LONG_CELLS: ${{ vars.COLLAPSE_LONG_CELLS }}
          # (옵션) 기사 주소 섹션을 <details>로 접기
          COLLAPSE_ARTICLE_URLS: ${{ vars.COLLAPSE_ARTICLE_URLS }}

          ISSUE_TITLE_BASE: "AI학습데이터 저작권 소송 모니터링"
          ISSUE_LABEL: "ai-lawsuit-monitor"
          # (옵션) 지브리 스타일 이미지 리포트 생성 활성화 (1: 활성화)
          GEMINI_DAILY_REPORT_IMAGEGEN: ${{ vars.GEMINI_DAILY_REPORT_IMAGEGEN || secrets.GEMINI_DAILY_REPORT_IMAGEGEN }}
          # 디버그 모드(0/1). Actions -> Variables에 DEBUG=1 설정 시 활성화
          DEBUG: ${{ vars.DEBUG }}
          # 이메일 전송 마스터 스위치 (1: 활성화, 0: 비활성화)
          ENABLE_EMAIL_SENDER: ${{ vars.ENABLE_EMAIL_SENDER || '0' }}
          # 타입별 발송 스위치 (기본 '1'=활성, '0'으로 설정 시 해당 타입만 발송 중단)
          # 🗓️ 조간뉴스
          ENABLE_EMAIL_MORNING: ${{ vars.ENABLE_EMAIL_MORNING || '1' }}
          # 🧠 석간뉴스
          ENABLE_EMAIL_EVENING: ${{ vars.ENABLE_EMAIL_EVENING || '1' }}
          # 🗓️ 조간뉴스 발행 기준 시각(KST, 0~23). 미설정 시 07시. 이 시각 이후
          # '첫 실행'에서 하루 1회 발행(멱등). 전용 cron(KST 07:10/07:50 이중화) +
          # 업무시간 매시(KST 08:25~) 실행이 있어, 일부 슬롯이 누락돼도 그날 안에 발행된다.
          MORNING_REPORT_HOUR: ${{ vars.MORNING_REPORT_HOUR || '7' }}
          # 석간뉴스(당일 요약) 발행 기준 시각(KST, 0~23). 미설정 시 21시.
          # 오프타임 cron(KST 21:25 = UTC 12:25)과 맞물려 하루 1회 저녁에 발행된다.
          EVENING_REPORT_HOUR: ${{ vars.EVENING_REPORT_HOUR || '21' }}
          # '당일 뉴스 소식' 섹션의 구글 뉴스 검색 기간(일). 미설정 시 코드 기본값 2일
          DAILY_NEWS_LOOKBACK_DAYS: ${{ vars.DAILY_NEWS_LOOKBACK_DAYS }}
          # 이메일 발송용 Gmail 앱 비밀번호 (Secret).
          # 신규 이름 GMAIL_APP_PASSWORD 우선, 구 이름(SMTP_PASS/SMTP_PASSWORD)은 전환기 폴백.
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || secrets.SMTP_PASS || secrets.SMTP_PASSWORD }}
        run: |
          python -m src.run

      - name: Commit and Push Image
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/img/daily_visual_report.png || true
          git commit -m "chore: update daily visual report image [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push failed or no changes"
