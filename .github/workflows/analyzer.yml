name: analyzer

# 검토 방식 A (GitHub PR 기반):
#   analyze → 후보 CSV 생성 → 브랜치 커밋 → PR 자동 생성
#   review-lawsuit-data-pr.yml이 정본 보존/스키마/건수/추적성을 검증해
#   통과하면 merge, 실패하면 사유를 남기고 close 한다.

permissions:
  contents: write
  pull-requests: write
  issues: read

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "분석할 최근 이슈 수"
        default: "3"
  # 매일 KST 10:00 자동 실행 — tracker(매시간 센싱)가 쌓은 이슈를 분석해
  # 변경 제안 PR을 생성한다. 반영 여부는 사람이 PR 검토로 결정(HITL).
  schedule:
    - cron: "0 1 * * *"  # UTC 01:00 = KST 10:00

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analyzer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 2.5 Flash Lite는 신규 사용자에게 404를 반환하므로 현행 Lite를 기본 사용한다.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_MODEL_FALLBACKS: ${{ vars.GEMINI_MODEL_FALLBACKS || 'gemini-3.5-flash-lite,gemini-flash-latest,gemini-3.5-flash,gemini-3.1-flash-lite,gemini-2.5-flash' }}
        run: |
          python -m src.run analyze --limit "${{ github.event.inputs.limit || '3' }}" --write-candidate

      - name: Create Pull Request if changes proposed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=proposals/last_run.json
          if [ ! -f "$LAST" ]; then echo "no last_run.json"; exit 0; fi
          HAS=$(python -c "import json;print(json.load(open('$LAST'))['has_changes'])")
          if [ "$HAS" != "True" ]; then echo "변경 제안 없음 → PR 생략"; exit 0; fi

          # last_run.json 의 경로는 절대경로이므로 그대로 사용
          STAMP=$(python -c "import json;print(json.load(open('$LAST'))['stamp'])")
          NEW=$(python -c "import json;print(json.load(open('$LAST'))['new'])")
          UPD=$(python -c "import json;print(json.load(open('$LAST'))['update'])")
          MD=$(python -c "import json;print(json.load(open('$LAST'))['markdown'])")
          CSV=$(python -c "import json;print(json.load(open('$LAST'))['candidate_csv'])")
          MINC=$(python -c "import json;print(json.load(open('$LAST')).get('min_confidence'))")
          THR=$(python -c "import json;print(json.load(open('$LAST')).get('auto_merge_threshold'))")

          BRANCH="analyzer/${STAMP}"
          cd "$GITHUB_WORKSPACE"  # repo root
          git config user.name "analyzer[bot]"
          git config user.email "analyzer@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$CSV"
          git commit -m "data: analyzer 제안 (NEW ${NEW}/UPDATE ${UPD}) [${STAMP}]"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "🤖 소송 데이터 갱신 제안 (NEW ${NEW}/UPDATE ${UPD}) — ${STAMP}" \
            --body-file "$MD" \
            --base main --head "$BRANCH" \
            --label "analyzer")
          echo "PR: $PR_URL"
          echo "min_confidence=${MINC}, analyzer_threshold=${THR}"

          # PR 번호를 워크플로 출력으로 넘겨 다음 스텝에서 인라인 리뷰한다.
          PR_NUM="${PR_URL##*/}"
          echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"
        id: create_pr

      # ⚠️ 기본 GITHUB_TOKEN 으로 만든 PR 은 pull_request_target 이벤트를 트리거하지
      #    않는다(GitHub 정책). 따라서 review-lawsuit-data-pr.yml 이 이 PR 에는
      #    절대 실행되지 않는다 → 여기서 같은 잡 안에서 즉시(인라인) 검토·병합/닫기 한다.
      #    (예약 sweep 워크플로가 혹시 누락된 건까지 추가로 보증한다.)
      - name: Review freshly created PR inline (event won't fire for token PRs)
        if: steps.create_pr.outputs.pr_number != ''
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m analyzer.src.pr_review --pr "${{ steps.create_pr.outputs.pr_number }}"
