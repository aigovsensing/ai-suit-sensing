name: consolidated-email

# '📑 당일 소송건들 통합 정리 자료'를 이메일로 발송하는 전용 워크플로.
#
# 발송 시점: KST 22시 이후.
#   - 석간뉴스는 KST 21시(EVENING_REPORT_HOUR 기본값) 실행에서 발송된다.
#   - 통합 정리 자료는 그 이후인 KST 22:00(= UTC 13:00)에 발송한다.
#
# 안전장치: run.py 의 send_consolidated_email() 는 당일 이슈에 '석간뉴스'가
# 이미 존재할 때만 이메일을 보낸다. 석간이 아직 없으면(예: EVENING_REPORT_HOUR 를
# 22시 이상으로 변경한 경우) 조용히 건너뛴다. 발송 시각을 바꾸려면 아래 cron 을
# 원하는 KST 시각의 UTC(−9시간) 값으로 조정할 것.

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "0 13 * * *" # KST 22:00 = UTC 13:00 (석간 KST 21시 발송 이후)
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        # 모노레포 통합: tracker/ 하위 프로젝트 기준으로 실행
        working-directory: tracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send consolidated report email
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_TITLE_BASE: "AI학습데이터 저작권 소송 모니터링"
          ISSUE_LABEL: "ai-lawsuit-monitor"
          # 디버그 모드(0/1). Actions -> Variables에 DEBUG=1 설정 시 활성화
          DEBUG: ${{ vars.DEBUG }}
          # 이메일 전송 마스터 스위치 (1: 활성화, 0: 비활성화)
          ENABLE_EMAIL_SENDER: ${{ vars.ENABLE_EMAIL_SENDER || '0' }}
          # 📑 당일 소송건들 통합 정리 리포트 타입별 발송 스위치
          # (기본 '1'=활성, '0'으로 설정 시 통합 정리 이메일만 발송 중단)
          ENABLE_EMAIL_CONSOLIDATED: ${{ vars.ENABLE_EMAIL_CONSOLIDATED || '1' }}
          # 이메일 발송용 SMTP 앱 비밀번호
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.SMTP_PASSWORD }}
        run: |
          python -m src.run consolidated-email
