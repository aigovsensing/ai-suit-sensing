name: consolidated-email

# '📑 당일 소송건들 통합 정리 자료'를 이메일로 발송하는 전용 워크플로.
#
# 발송 시점: KST 22:40 (= UTC 13:40).
#   - 석간뉴스는 KST 21시(EVENING_REPORT_HOUR 기본값) 실행에서 발송된다.
#   - 통합 정리 자료는 그 이후인 KST 22:40 에 발송한다. 매시 정각(:00)은 GitHub
#     Actions 예약 지연이 커 자정을 넘기기 쉬우므로, 분을 :40 으로 두고 자정까지
#     여유(약 1h20m)를 둔다.
#
# 안전장치(run.py send_consolidated_email):
#   - '석간뉴스'가 이미 발행된 이슈에만 발송한다(순서 보장).
#   - 예약 실행이 GitHub 지연으로 KST 자정을 넘겨 다음 날 새벽에 돌더라도, 오늘 →
#     어제 순으로 '석간이 발행된' 이슈를 찾아 폴백하므로 미발송되지 않는다.
#   - 숨김 마커로 하루 1회만 발송(지연/수동 재실행 중복 방지).

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "40 13 * * *" # KST 22:40 = UTC 13:40 (석간 KST 21시 발송 이후, 정각 회피)
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        # 모노레포 통합: tracker/ 하위 프로젝트 기준으로 실행
        working-directory: tracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send consolidated report email
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_TITLE_BASE: "AI학습데이터 저작권 소송 모니터링"
          ISSUE_LABEL: "ai-lawsuit-monitor"
          # 디버그 모드(0/1). Actions -> Variables에 DEBUG=1 설정 시 활성화
          DEBUG: ${{ vars.DEBUG }}
          # 이메일 전송 마스터 스위치 (1: 활성화, 0: 비활성화)
          ENABLE_EMAIL_SENDER: ${{ vars.ENABLE_EMAIL_SENDER || '0' }}
          # 📑 당일 소송건들 통합 정리 리포트 타입별 발송 스위치
          # (기본 '1'=활성, '0'으로 설정 시 통합 정리 이메일만 발송 중단)
          ENABLE_EMAIL_CONSOLIDATED: ${{ vars.ENABLE_EMAIL_CONSOLIDATED || '1' }}
          # 이메일 발송용 Gmail 앱 비밀번호 (Secret).
          # 신규 이름 GMAIL_APP_PASSWORD 우선, 구 이름(SMTP_PASS/SMTP_PASSWORD)은 전환기 폴백.
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || secrets.SMTP_PASS || secrets.SMTP_PASSWORD }}
        run: |
          python -m src.run consolidated-email
